<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .photo { aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--pale); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-family: 'Poppins', Arial, sans-serif; font-weight: 700; font-size: 34px; margin-top: 28px; }
  .cn { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .role { font-size: 17px; line-height: 1.75; margin-top: 20px; }
  ul { list-style: none; margin-top: 24px; }
  li { margin-top: 14px; }
  a { color: var(--label); text-decoration: none; font-size: 17px; }
  a:hover { text-decoration: underline; }
</style>
